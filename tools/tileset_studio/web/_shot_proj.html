<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图块工坊 · 工程包演示</title>
<style>
  body { margin:0; background:#15171b; }
  #fr { width:1620px; height:1000px; border:0; display:block; }
</style>
</head>
<body>
<iframe id="fr" src="/"></iframe>
<script>
/* 演示驱动：载入素材 → 存一个工程包 → 打开「开工程」面板（截图用） */
setTimeout(async () => {
  const fr = document.getElementById('fr');
  const W = fr.contentWindow, T = W.TS, S = T.S;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    const roots = await (await fetch('/api/roots')).json();
    T.setOutDir(roots.toolOut);
    const list = await (await fetch('/api/list?dir=' + encodeURIComponent(roots.mapSrc) + '&sizes=1')).json();
    const m = list.items.find(x => x.name === 'map1_7x6.png');
    await T.openSheetByPath(m.path, m.name);
    await wait(200);
    S.sel.clear(); [26,27,33,34].forEach(i => S.sel.add(i));
    [26,27,33,34].forEach(i => S.tagOf[i] = 'ground');
    T.doPlace('none');
    await wait(150);
    S.curSlot = 'B';
    await T.saveProject('演示_地图工程', roots.toolOut);
    await wait(200);
    T.openProjDialog();
    await wait(400);
    document.title = 'ready';
  } catch (e) {
    document.title = 'ERR ' + e.message;
  }
}, 4800);
</script>
</body>
</html>
