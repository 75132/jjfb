<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>战斗房间监控 - 实时战斗数据</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .rooms-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .rooms-toolbar .refresh-info {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .room-list {
      display: grid;
      gap: 16px;
    }
    .room-card {
      background: var(--bg-card);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 16px;
      border-left: 4px solid var(--info-color);
    }
    .room-card.finished {
      border-left-color: var(--text-muted);
      opacity: 0.85;
    }
    .room-card .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .room-card .room-id {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .room-card .room-meta {
      font-size: 12px;
      color: var(--text-muted);
    }
    .room-card .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .room-card .status-badge.in_progress {
      background: rgba(33, 150, 243, 0.15);
      color: var(--info-color);
    }
    .room-card .status-badge.finished {
      background: rgba(158, 158, 158, 0.2);
      color: var(--text-muted);
    }
    .room-card .battle-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin: 12px 0;
    }
    .room-card .side-block {
      padding: 10px 12px;
      background: var(--bg-primary);
      border-radius: 6px;
    }
    .room-card .side-block.player { border-left: 3px solid var(--success-color); }
    .room-card .side-block.enemy { border-left: 3px solid var(--danger-color); }
    .room-card .side-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
    .room-card .side-hp { font-size: 12px; color: var(--text-secondary); }
    .room-card .vs { text-align: center; font-weight: 700; color: var(--text-muted); font-size: 14px; }
    .room-card .countdown {
      font-size: 13px;
      color: var(--warning-color);
      font-weight: 600;
    }
    .room-card .result-line {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="index.html" class="btn btn-outline" style="color: white; border-color: rgba(255,255,255,0.3);">← 返回</a>
      <h1>⚔️ 战斗房间监控</h1>
    </div>
    <div class="header-status">
      <div class="status-badge">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">轮询中</span>
      </div>
      <div class="status-badge">房间数: <strong id="roomCount">0</strong></div>
    </div>
  </div>

  <div class="container">
    <div class="rooms-toolbar">
      <span class="refresh-info">每 2 秒刷新，根据服务器实时创建/销毁/更新</span>
    </div>
    <div class="room-list" id="roomList"></div>
    <div class="empty-state" id="emptyState" style="display: none;">当前没有进行中的战斗房间</div>
  </div>

  <script>
    (function () {
      const POLL_INTERVAL_MS = 2000;
      const roomListEl = document.getElementById('roomList');
      const emptyStateEl = document.getElementById('emptyState');
      const roomCountEl = document.getElementById('roomCount');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      function getApiBase() {
        return window.location.origin;
      }

      function formatTime(ts) {
        if (ts == null) return '-';
        const d = new Date(typeof ts === 'number' ? (ts < 1e12 ? ts * 1000 : ts) : ts);
        return isNaN(d.getTime()) ? '-' : d.toLocaleTimeString('zh-CN', { hour12: false });
      }

      function renderRoom(room) {
        const status = room.status || 'in_progress';
        const player = room.player || {};
        const enemy = room.enemy || {};
        const result = room.result;
        const remaining = room.remaining_command_seconds;
        const isFinished = status === 'finished';

        let countdownHtml = '';
        if (!isFinished && remaining != null) {
          const sec = Math.max(0, Math.ceil(Number(remaining)));
          countdownHtml = '<div class="countdown">指令剩余: ' + sec + ' 秒</div>';
        }
        let resultHtml = '';
        if (result) {
          const win = result.winner === 'player' ? '玩家' : '敌方';
          const reason = result.reason === 'escape' ? '逃跑' : '击倒';
          resultHtml = '<div class="result-line">结果: ' + win + ' 胜 (' + reason + ')</div>';
        }

        return (
          '<div class="room-card ' + (isFinished ? 'finished' : '') + '" data-room-id="' + (room.room_id || '') + '">' +
            '<div class="room-header">' +
              '<span class="room-id">' + (room.room_id || '-') + '</span>' +
              '<span class="status-badge ' + status + '">' + (status === 'in_progress' ? '进行中' : '已结束') + '</span>' +
            '</div>' +
            '<div class="room-meta">' +
              '角色ID: ' + (room.character_id || '-') + ' · 回合: ' + (room.round || 1) + ' · 创建: ' + formatTime(room.created_at) +
            '</div>' +
            '<div class="battle-row">' +
              '<div class="side-block player">' +
                '<div class="side-name">' + (player.name || '玩家') + '</div>' +
                '<div class="side-hp">HP: ' + (player.hp ?? '-') + ' / ' + (player.max_hp ?? '-') + '</div>' +
              '</div>' +
              '<div class="vs">VS</div>' +
              '<div class="side-block enemy">' +
                '<div class="side-name">' + (enemy.name || '敌方') + '</div>' +
                '<div class="side-hp">HP: ' + (enemy.hp ?? '-') + ' / ' + (enemy.max_hp ?? '-') + '</div>' +
              '</div>' +
            '</div>' +
            countdownHtml +
            resultHtml +
          '</div>'
        );
      }

      function fetchRooms() {
        const base = getApiBase();
        fetch(base + '/api/battle-rooms')
          .then(function (res) { return res.json(); })
          .then(function (rooms) {
            if (!Array.isArray(rooms)) rooms = [];
            roomCountEl.textContent = rooms.length;
            if (rooms.length === 0) {
              roomListEl.innerHTML = '';
              emptyStateEl.style.display = 'block';
            } else {
              emptyStateEl.style.display = 'none';
              roomListEl.innerHTML = rooms.map(function (r) { return renderRoom(r); }).join('');
            }
            if (statusDot) statusDot.classList.remove('disconnected');
            if (statusText) statusText.textContent = '已连接';
          })
          .catch(function () {
            if (statusDot) statusDot.classList.add('disconnected');
            if (statusText) statusText.textContent = '请求失败';
          });
      }

      fetchRooms();
      setInterval(fetchRooms, POLL_INTERVAL_MS);
    })();
  </script>
</body>
</html>
